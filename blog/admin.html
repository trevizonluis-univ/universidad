<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Blog - EconómicaMente</title>
    <!-- Quill editor CSS y JS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border: 1px solid #aaa;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }

        h1,
        h2 {
            color: #1a3a6c;
            border-bottom: 2px solid #ffb81c;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #aaa;
            background: white;
            font-family: inherit;
        }

        button {
            background: #1a3a6c;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        button.danger {
            background: #dc3545;
        }

        button.success {
            background: #28a745;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #1a3a6c;
            color: white;
        }

        .formulario-edicion {
            background: #f9f9f9;
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
        }

        .mensaje {
            padding: 10px;
            margin-bottom: 15px;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: none;
        }

        .error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        /* Quill editor alto */
        #editor-container {
            height: 400px;
            margin-bottom: 12px;
        }

        /* vista previa de imagen de portada */
        .img-preview {
            max-width: 200px;
            margin-top: 8px;
            border: 1px solid #ccc;
            padding: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Panel de Administración - EconómicaMente</h1>

        <div id="loginBox">
            <h2>Iniciar sesión</h2>
            <input type="email" id="email" placeholder="Correo electrónico">
            <input type="password" id="password" placeholder="Contraseña">
            <button id="btnLogin">Entrar</button>
            <div id="loginMsg" class="mensaje"></div>
        </div>

        <div id="adminPanel" style="display:none;">
            <button id="btnLogout">Cerrar sesión</button>
            <hr style="margin: 15px 0;">

            <div class="formulario-edicion">
                <h2 id="formTitle">Agregar nuevo artículo</h2>
                <input type="hidden" id="editId">

                <label>Título *</label>
                <input type="text" id="title" placeholder="Título del artículo">

                <label>Categoría</label>
                <input type="text" id="category" placeholder="Ej: Macroeconomía">

                <label>Fecha (ej: 15 mayo, 2026)</label>
                <input type="text" id="date" placeholder="15 mayo, 2026">

                <label>Tiempo de lectura (ej: 8 min lectura)</label>
                <input type="text" id="readTime" placeholder="8 min lectura">

                <label>Extracto (resumen corto que sale en la tarjeta)</label>
                <textarea id="excerpt" rows="2" placeholder="Resumen corto..."></textarea>

                <label>Imagen de portada</label>
                <input type="file" id="imgFile" accept="image/*">
                <div id="imgPreview" class="img-preview"></div>
                <input type="hidden" id="imgUrl">

                <label>Contenido completo del artículo (puedes pegar texto con formato, imágenes, etc.)</label>
                <div id="editor-container"></div>
                <input type="hidden" id="contentHtml">

                <div>
                    <button id="btnSave" class="success">Guardar artículo</button>
                    <button id="btnCancel" class="danger">Cancelar edición</button>
                </div>
            </div>

            <h2>Artículos existentes</h2>
            <div id="mensajeListado" class="mensaje"></div>
            <table id="tablaArticulos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Categoría</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodyArticulos"></tbody>
            </table>
        </div>
    </div>

    <script>
        // ⭐⭐⭐ CONFIGURACIÓN - REEMPLAZA CON TUS DATOS ⭐⭐⭐
        const SUPABASE_URL = 'https://lqdovfnemhotouljektr.supabase.co/';
        const SUPABASE_ANON_KEY = 'sb_publishable_tygjFhHRzQFmOnl-lRj4iA_Lb44gmHC';
        // ====================================================

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;
        let quillEditor = null;   // instancia de Quill

        // Inicializar editor Quill (después del login)
        function initQuill() {
            if (quillEditor) return;
            quillEditor = new Quill('#editor-container', {
                theme: 'snow',
                placeholder: 'Escribe aquí el artículo completo. Puedes pegar desde Word, Google Docs, o arrastrar imágenes...',
                modules: {
                    toolbar: [
                        [{ 'header': [1, 2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                        ['link', 'image'],
                        ['clean']
                    ]
                }
            });
            // Manejar subida de imágenes desde el editor (al hacer clic en imagen)
            const imageHandler = () => {
                const input = document.createElement('input');
                input.setAttribute('type', 'file');
                input.setAttribute('accept', 'image/*');
                input.click();
                input.onchange = async () => {
                    const file = input.files[0];
                    if (!file) return;
                    const url = await subirImagenStorage(file);
                    if (url) {
                        const range = quillEditor.getSelection(true);
                        quillEditor.insertEmbed(range.index, 'image', url);
                    }
                };
            };
            const toolbar = quillEditor.getModule('toolbar');
            toolbar.addHandler('image', imageHandler);
        }

        // Subir imagen al bucket "articulos" y devolver URL pública
        async function subirImagenStorage(file) {
            const fileName = `${Date.now()}_${file.name}`;
            const { data, error } = await supabaseClient.storage
                .from('articulos')
                .upload(fileName, file);
            if (error) {
                mostrarMensaje('mensajeListado', 'Error al subir imagen: ' + error.message, true);
                return null;
            }
            const { data: publicUrlData } = supabaseClient.storage
                .from('articulos')
                .getPublicUrl(fileName);
            return publicUrlData.publicUrl;
        }

        // Mostrar mensaje temporal
        function mostrarMensaje(elId, texto, esError = false) {
            const el = document.getElementById(elId);
            if (!el) return;
            el.textContent = texto;
            el.className = 'mensaje' + (esError ? ' error' : '');
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        // Cargar lista de artículos
        async function cargarArticulos() {
            const { data, error } = await supabaseClient.from('articulos').select('*').order('created_at', { ascending: false });
            if (error) return mostrarMensaje('mensajeListado', 'Error: ' + error.message, true);
            const tbody = document.getElementById('tbodyArticulos');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<td><td colspan="5">No hay artículos aún. Crea uno.</td></tr>';
                return;
            }
            data.forEach(art => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = art.id;
                row.insertCell(1).textContent = art.title || '';
                row.insertCell(2).textContent = art.category || '';
                row.insertCell(3).textContent = art.date || '';
                const acc = row.insertCell(4);
                const btnEdit = document.createElement('button');
                btnEdit.textContent = 'Editar';
                btnEdit.style.background = '#ffc107';
                btnEdit.style.color = '#000';
                btnEdit.onclick = () => cargarParaEditar(art);
                const btnDel = document.createElement('button');
                btnDel.textContent = 'Eliminar';
                btnDel.className = 'danger';
                btnDel.onclick = () => eliminarArticulo(art.id);
                acc.appendChild(btnEdit);
                acc.appendChild(btnDel);
            });
        }

        // Cargar datos en el formulario para editar
        function cargarParaEditar(art) {
            document.getElementById('formTitle').textContent = 'Editar artículo';
            document.getElementById('editId').value = art.id;
            document.getElementById('title').value = art.title || '';
            document.getElementById('category').value = art.category || '';
            document.getElementById('date').value = art.date || '';
            document.getElementById('readTime').value = art.readTime || '';
            document.getElementById('excerpt').value = art.excerpt || '';
            // Imagen
            if (art.img) {
                document.getElementById('imgPreview').innerHTML = `<img src="${art.img}" style="max-width:100%">`;
                document.getElementById('imgUrl').value = art.img;
            } else {
                document.getElementById('imgPreview').innerHTML = '';
                document.getElementById('imgUrl').value = '';
            }
            // Contenido en Quill
            if (quillEditor) {
                quillEditor.root.innerHTML = art.content || '';
            }
            document.querySelector('.formulario-edicion').scrollIntoView({ behavior: 'smooth' });
        }

        async function guardarArticulo() {
            const id = document.getElementById('editId').value;
            // Tomar contenido HTML desde Quill
            const contenidoHTML = quillEditor ? quillEditor.root.innerHTML : '';

            const datos = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value,
                readTime: document.getElementById('readTime').value,
                excerpt: document.getElementById('excerpt').value,
                img: document.getElementById('imgUrl').value,
                content: contenidoHTML
            };
            if (!datos.title) return mostrarMensaje('mensajeListado', 'El título es obligatorio', true);

            let result;
            if (id) result = await supabaseClient.from('articulos').update(datos).eq('id', id);
            else result = await supabaseClient.from('articulos').insert([datos]);

            if (result.error) mostrarMensaje('mensajeListado', 'Error: ' + result.error.message, true);
            else {
                mostrarMensaje('mensajeListado', 'Artículo guardado');
                limpiarFormulario();
                cargarArticulos();
            }
        }

        async function eliminarArticulo(id) {
            if (!confirm('¿Eliminar permanentemente?')) return;
            const { error } = await supabaseClient.from('articulos').delete().eq('id', id);
            if (error) mostrarMensaje('mensajeListado', error.message, true);
            else { mostrarMensaje('mensajeListado', 'Eliminado'); cargarArticulos(); }
        }

        function limpiarFormulario() {
            document.getElementById('formTitle').textContent = 'Agregar nuevo artículo';
            document.getElementById('editId').value = '';
            document.getElementById('title').value = '';
            document.getElementById('category').value = '';
            document.getElementById('date').value = '';
            document.getElementById('readTime').value = '';
            document.getElementById('excerpt').value = '';
            document.getElementById('imgUrl').value = '';
            document.getElementById('imgPreview').innerHTML = '';
            if (quillEditor) quillEditor.root.innerHTML = '';
            document.getElementById('imgFile').value = '';
        }

        // Subir imagen de portada cuando se selecciona un archivo
        document.getElementById('imgFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = await subirImagenStorage(file);
            if (url) {
                document.getElementById('imgUrl').value = url;
                document.getElementById('imgPreview').innerHTML = `<img src="${url}" style="max-width:100%">`;
            }
        });

        // Autenticación
        async function login(email, password) {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw error;
            currentUser = data.user;
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            limpiarFormulario();
        }

        async function verificarSesion() {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                currentUser = data.session.user;
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                initQuill(); // inicializar editor después de login
                cargarArticulos();
            } else {
                document.getElementById('loginBox').style.display = 'block';
                document.getElementById('adminPanel').style.display = 'none';
            }
        }

        // Eventos
        document.getElementById('btnLogin').onclick = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if (!email || !pass) return mostrarMensaje('loginMsg', 'Completa email y contraseña', true);
            try {
                await login(email, pass);
                await verificarSesion();
            } catch (e) {
                mostrarMensaje('loginMsg', e.message, true);
            }
        };
        document.getElementById('btnLogout').onclick = logout;
        document.getElementById('btnSave').onclick = guardarArticulo;
        document.getElementById('btnCancel').onclick = limpiarFormulario;

        verificarSesion();
    </script>
</body>

</html>
